services:
  computer-use:
    build: .
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      API_PROVIDER: ${API_PROVIDER:-anthropic}
      SESSION_DB_PATH: /home/computeruse/.anthropic/sessions.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:5900:5900"
    volumes:
      - session-data:/home/computeruse/.anthropic
    shm_size: "2gb"
    restart: unless-stopped

volumes:
  session-data:
